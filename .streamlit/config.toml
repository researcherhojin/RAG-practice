# RAG Lab — Streamlit 테마 / UI 설정
# 라이트 미니멀(Anthropic 풍): 따뜻한 흰 배경, 절제된 보더, 차분한 primary.

[theme]
base = "light"
primaryColor = "#C2643D"             # 차분한 테라코타(주황/갈색톤)
backgroundColor = "#FAFAF9"          # 거의 흰색, 따뜻한 톤
secondaryBackgroundColor = "#F2F0EB" # 위젯·사이드바 은은한 배경
textColor = "#1A1A18"
linkColor = "#C2643D"
borderColor = "#E5E2DC"              # 얕은 회색 보더
baseRadius = "0.5rem"                # 중간 둥글기
showSidebarBorder = true
font = "Inter"

# 본문 폰트로 Inter 를 불러온다 (못 받으면 시스템 산세리프로 폴백).
[[theme.fontFaces]]
family = "Inter"
url = "https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.woff2"
weight = "600"
style = "normal"

[client]
toolbarMode = "minimal"

[server]
# 업로드 파일 크기 상한 (기본 200MB → 자원/보안 차원에서 제한)
maxUploadSize = 50
